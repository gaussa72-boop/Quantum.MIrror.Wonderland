name: Quantum Game Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile active game-studio modules
        run: python -m py_compile app.py game_engine.py studio_api.py ki_game_mod_api.py game_engines/federation_api.py quantum_game_engine/*.py ki_game_mod/engine/*.py
      - name: Validate Unreal native starter
        run: python -m unittest discover -s native/SpiritualWarfare/tests -v
      - run: pytest -q tests/test_game_engine.py tests/test_quantum_game_engine.py tests/test_ki_game_mod.py
      - name: Smoke tests
        run: |
          python - <<'PY'
          import os
          from app import app
          client = app.test_client()
          assert client.get('/health').status_code == 200
          assert client.get('/api/generator/health').status_code == 200
          assert client.get('/api/ki-game-mod/health').status_code == 200
          assert client.get('/dark-mirror-game/').status_code == 200
          plan = client.post('/api/generator/plan', json={'prompt':'Dunkle Spiegel RPG','target':'web','kind':'game'})
          assert plan.status_code == 200, plan.data
          blueprint = client.post('/api/generator/blueprint', json={'prompt':'Mirror world adventure'})
          assert blueprint.status_code == 200, blueprint.data
          print('smoke tests: OK')
          PY
