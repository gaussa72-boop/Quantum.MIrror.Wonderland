name: Quantum Game Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: pytest -q tests/test_game_engine.py tests/test_quantum_game_engine.py
      - run: python - <<'PY'
import os
from app import app
client = app.test_client()
assert client.get('/health').status_code == 200
assert client.get('/api/generator/health').status_code == 200
plan = client.post('/api/generator/plan', json={'prompt':'Dunkle Spiegel RPG','target':'web','kind':'game'} )
assert plan.status_code == 200, plan.data
blueprint = client.post('/api/generator/blueprint', json={'prompt':'Mirror world adventure'})
assert blueprint.status_code == 200, blueprint.data
print('smoke tests: OK')
PY
