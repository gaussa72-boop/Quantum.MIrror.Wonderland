name: Game Engine Federation CI

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "game_engines/**"
      - "game-engines/**"
      - "ki_game_mod/**"
      - "ki_game_mod_api.py"
      - "tests/test_game_engine_federation.py"
      - ".github/workflows/game-engine-federation.yml"
  pull_request:
    paths:
      - "app.py"
      - "game_engines/**"
      - "game-engines/**"
      - "ki_game_mod/**"
      - "ki_game_mod_api.py"
      - "tests/test_game_engine_federation.py"
      - ".github/workflows/game-engine-federation.yml"

jobs:
  federation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py game_engines ki_game_mod ki_game_mod_api.py
      - run: python -m unittest discover -s tests -p "test_game_engine_federation.py" -v
