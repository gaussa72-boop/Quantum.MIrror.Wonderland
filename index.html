<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dunkle Spiegel — Quantum AI Game Engine</title><link rel="stylesheet" href="style.css"><style id="mirror-wonderland-redesign">
:root{color-scheme:dark;--gold:#e9c879;--violet:#9d79ff}
*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% 8%,#30213e 0%,#100d19 42%,#05050a 100%) fixed!important;color:#f6edda!important;font-family:Georgia,'Times New Roman',serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background:linear-gradient(90deg,transparent 49.8%,#d5b76b22 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#d5b76b18 50%,transparent 50.2%),radial-gradient(circle at center,transparent 0 22%,#d5b76b12 22.2% 22.5%,transparent 22.7% 34%,#d5b76b12 34.2% 34.5%,transparent 34.7%);background-size:100% 100%;z-index:0}
body>*{position:relative;z-index:1}.sacred-geometry-container{filter:drop-shadow(0 0 18px #d4b66b55)}.agents-orbit-container{border:1px solid #d4b66b55;border-radius:50%;box-shadow:0 0 70px #8c65c526,inset 0 0 50px #d4b66b12;background:radial-gradient(circle,#2b1b37aa,transparent 68%)}.agent-avatar{background:linear-gradient(145deg,#261a32,#0b0a11)!important;border:1px solid #d4b66b!important;box-shadow:0 0 24px #d4b66b30;border-radius:18px!important;color:#f9e6b4!important}.agent-icon{filter:drop-shadow(0 0 8px #d4b66b)}.agent-name{letter-spacing:.1em;text-transform:uppercase;color:#f1d58d!important}
button,input,textarea{background:#100d19!important;color:#f6edda!important;border:1px solid #bda15b!important;border-radius:12px!important}button{background:linear-gradient(135deg,#d8b968,#8064a8)!important;color:#100d19!important;font-weight:bold!important;cursor:pointer}section,.panel,.chat-container,.card{background:linear-gradient(145deg,#191323ed,#08070dee)!important;border:1px solid #bda15b44!important;border-radius:18px!important;box-shadow:0 14px 50px #0008}
</style>
</head>
<body>
<div class="sacred-geometry-container"><canvas id="sacred-geometry-canvas" class="sacred-geometry"></canvas></div>
<div class="agents-orbit-container">
<div class="agent-orbit agent-1" data-agent="singulos"><div class="agent-avatar"><span class="agent-icon">🌟</span><span class="agent-name">Singulos</span></div></div><div class="agent-orbit agent-2 active" data-agent="ionos7"><div class="agent-avatar"><span class="agent-icon">⚡</span><span class="agent-name">IONOS-7</span></div></div><div class="agent-orbit agent-3" data-agent="ultra"><div class="agent-avatar"><span class="agent-icon">🚀</span><span class="agent-name">Ultra</span></div></div><div class="agent-orbit agent-4" data-agent="nexus"><div class="agent-avatar"><span class="agent-icon">🧠</span><span class="agent-name">Nexus</span></div></div><div class="agent-orbit agent-5" data-agent="quantum"><div class="agent-avatar"><span class="agent-icon">⚛️</span><span class="agent-name">Quantum</span></div></div><div class="agent-orbit agent-6" data-agent="spark"><div class="agent-avatar"><span class="agent-icon">✨</span><span class="agent-name">Spark</span></div></div><div class="agent-orbit agent-7" data-agent="nova"><div class="agent-avatar"><span class="agent-icon">💫</span><span class="agent-name">Nova</span></div></div><div class="agent-orbit agent-8" data-agent="zenith"><div class="agent-avatar"><span class="agent-icon">🔱</span><span class="agent-name">Zenith</span></div></div><div class="agent-orbit agent-9" data-agent="aether"><div class="agent-avatar"><span class="agent-icon">🌌</span><span class="agent-name">Aether</span></div></div><div class="agent-orbit agent-10" data-agent="infinity"><div class="agent-avatar"><span class="agent-icon">∞</span><span class="agent-name">Infinity</span></div></div></div>
<div class="active-agent-display"><div class="active-agent-info"><div class="active-agent-icon" id="active-agent-icon">⚡</div><div class="active-agent-name" id="active-agent-name">IONOS-7</div><div class="active-agent-status">Online · Game Engine</div></div></div>
<div id="chat-container" class="chat-interface"><div class="chat-header"><div class="chat-title"><span id="chat-agent-name">IONOS-7</span><span class="chat-status-indicator"></span></div><button id="close-chat" class="close-btn">✕</button></div><div id="chat-messages" class="chat-messages-area"></div><div class="chat-input-area"><input id="chat-input" type="text" placeholder="Idee für Game, DLC, Mod …"><button id="chat-send" class="send-btn">➤</button></div></div>
<div class="info-panel"><div class="info-title">DUNKLE SPIEGEL</div><div class="info-subtitle">AI GAME ENGINE</div><div class="info-agents-count">10 KI-Agenten · <a href="/studio">Game Studio öffnen →</a></div></div>
<script src="app_engine.js"></script><script>(function(){const M=[["openai/gpt-5.6-luna","OpenAI · GPT-5.6 Luna"],["anthropic/claude-sonnet-5","Anthropic · Claude Sonnet 5"],["google/gemini-3.8-flash","Google · Gemini 3.8 Flash"],["x-ai/grok-4.7","xAI · Grok 4.7"],["deepseek/deepseek-v4.1-flash","DeepSeek · V4.1 Flash"],["z-ai/glm-5.3-flashx","Z.ai · GLM 5.3 FlashX"],["qwen/qwen3.7-plus-20260602","Qwen · Qwen3.7 Plus"],["moonshotai/kimi-k3","Moonshot · Kimi K3"],["minimax/minimax-m3","MiniMax · M3"],["mistralai/mistral-small-2603","Mistral · Small 4"]];const s=document.createElement('select');s.id='ai-model-select';s.setAttribute('aria-label','KI-Modell wählen');s.style.cssText='position:fixed;top:14px;right:14px;z-index:9999;background:#15131f;color:#fff;border:1px solid #8b5cf6;border-radius:999px;padding:7px 10px;font:inherit;max-width:230px';M.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)});const x=localStorage.getItem('ai_model');if(x&&M.some(m=>m[0]===x))s.value=x;s.onchange=()=>localStorage.setItem('ai_model',s.value);document.body.appendChild(s)})()</script></body></html>
