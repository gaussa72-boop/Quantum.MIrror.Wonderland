<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum Mirror · AI</title><style>:root{--a:#8b7cff}*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#eee;font:14px Inter,system-ui}.app{height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid #292933;background:#111116;padding:15px}.brand{font-weight:800;font-size:17px;margin:12px 4px 22px}.side a{display:block;padding:10px;color:#ccc;text-decoration:none;border-radius:8px}.side a:hover{background:#1d1d25}.main{display:grid;grid-template-rows:58px 1fr auto}.top{border-bottom:1px solid #292933;padding:0 20px;display:flex;align-items:center;gap:10px}.pill{border:1px solid #34343e;border-radius:999px;padding:5px 9px;color:#aaa;font-size:11px}.chat{width:min(900px,92%);margin:auto;height:100%;overflow:auto;padding:30px 0 110px}.welcome{text-align:center;margin-top:20vh}.welcome h1{font-size:30px}.welcome p{color:#999}.m{max-width:780px;margin:18px auto;padding:12px 14px;line-height:1.65;white-space:pre-wrap}.user{background:#19191f;border-radius:16px}.ai{border-left:2px solid var(--a)}.composer{width:min(900px,92%);margin:0 auto 18px;display:flex;gap:8px;border:1px solid #3a3a45;border-radius:18px;background:#15151b;padding:9px}.composer input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:10px}.composer button{background:var(--a);border:0;border-radius:12px;padding:0 18px;font-weight:800}.engine{margin-left:auto;color:#ddd;text-decoration:none;border:1px solid #34343e;border-radius:9px;padding:7px 10px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">Quantum Mirror</div><a href="/chat">⌁ Chat</a><a href="/studio">◈ Game Studio</a><a href="/">🪞 Wonderland</a><a href="/health">System Status</a></aside><main class="main"><header class="top"><b>Quantum Mirror AI</b><span class="pill">GPT-6 Astra · High reasoning</span><a class="engine" href="/studio">Game Engine →</a></header><section class="chat" id="chat"><div class="welcome"><h1>Wie kann ich helfen?</h1><p>Game Design · Coding · Worldbuilding · Recherche</p></div></section><form class="composer"><input id="q" placeholder="Nachricht an Quantum Mirror …"><button>Senden</button></form></main></div><script>const f=document.querySelector('form'),q=document.querySelector('#q'),c=document.querySelector('#chat');function add(t,k){const e=document.createElement('div');e.className='m '+k;e.textContent=t;c.appendChild(e);c.scrollTop=c.scrollHeight}f.onsubmit=async e=>{e.preventDefault();const x=q.value.trim();if(!x)return;add(x,'user');q.value='';add('Denke …','ai');const w=c.lastChild;try{const r=await fetch('/api/chat/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:x})});const d=await r.json();w.remove();add(d.response||d.error||'Keine Antwort','ai')}catch(_){w.remove();add('Verbindung fehlgeschlagen.','ai')}};</script></body></html>
